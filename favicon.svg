<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0D1521"/>

  <!-- Outer ring (white, segmented) -->
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#FFFFFF" stroke-width="2.6"
          stroke-linecap="round" pathLength="100" stroke-dasharray="38 6 30 6 14 6"
          transform="rotate(-80 32 32)"/>

  <!-- Inner ring (white, softer) -->
  <circle cx="32" cy="32" r="22.5" fill="none" stroke="#FFFFFF" stroke-width="1.8"
          stroke-opacity="0.55" stroke-linecap="round" pathLength="100"
          stroke-dasharray="30 20" transform="rotate(20 32 32)"/>

  <!-- Robot (cyan) -->
  <g fill="none" stroke="#00E5FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="22.5" r="1.8"/>
    <line x1="32" y1="24.3" x2="32" y2="29"/>
    <path d="M20.5 34 a3 3 0 0 0 0 7"/>
    <path d="M43.5 34 a3 3 0 0 1 0 7"/>
    <rect x="20.5" y="29" width="23" height="15" rx="7.5"/>
  </g>
  <circle cx="28" cy="36.5" r="2" fill="#00E5FF"/>
  <circle cx="36" cy="36.5" r="2" fill="#00E5FF"/>
</svg>
